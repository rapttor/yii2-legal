name: CI
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '${{ matrix.php }}', extensions: 'mbstring, intl, pdo_sqlite', coverage: none }
      - run: composer validate --strict
      # Works before and after rapttor/legal is on Packagist: the VCS repository is only a fallback source.
      - run: composer config repositories.legal vcs https://github.com/rapttor/rapttor.legal
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/phpunit -c phpunit.xml
